name: v0.50 Deployment Shell Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Smoke tests
        env:
          LIVE_EXECUTION: 'false'
          PAPER_EXECUTION: 'false'
          BOT_FORWARD_PAPER_ENABLED: 'false'
          BOT_PAPER_EXECUTION_ENABLED: 'false'
        run: pytest -q test_app.py
      - name: Verify fail-closed startup guard
        run: |
          set +e
          LIVE_EXECUTION=true python -c 'import app' >/tmp/out 2>/tmp/err
          code=$?
          set -e
          test "$code" -ne 0
          grep -q 'Execution firewall violation' /tmp/err
